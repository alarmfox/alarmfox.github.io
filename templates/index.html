{% extends "base.html" %}

{% block title %}
{{ username }} Site
{% endblock %}

{% block content %}
<h1>{{ full_name }} ({{ username }})</h1>
<a href={{ github }}>github</a>
<a href={{ codeberg }}>codeberg</a>
<a href=mailto:{{ email }}>email</a>

<div>
  {{ description | safe }}
</div>

<h2>Latest posts</h2>
<div>
{% for post in latest_posts %}
    <a href="{{ post.relative_path }}">
        {{ post.date }} {{ post.short_title() }}
    </a>
{% endfor %}
</div>
{% endblock %}
